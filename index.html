<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="md2print — Éditeur Markdown et exportateur multi-formats (HTML autonome, DOCX, PPTX)">
  <title>md2print</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Bibliothèques tierces locales (100 % hors-ligne ; JSZip et docx sont chargés à la demande lors de l'export) -->
  <script defer src="vendor/marked.min.js"></script>
  <script defer src="vendor/highlight.min.js"></script>
  <script defer src="vendor/mermaid.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Barre de Menu Supérieure -->
    <header class="app-header">
      <!-- Zone Gauche : Gestion des fichiers .md -->
      <div class="header-group header-left">
        <span class="app-brand">md2print</span>
        <button type="button" class="btn" id="btnNewFile">Nouveau</button>
        <button type="button" class="btn" id="btnOpenFile">Ouvrir fichier</button>
        <input type="file" id="fileInput" class="hidden-input" accept=".md,.markdown,.txt">

        <button type="button" class="btn" id="btnOpenFolder">Ouvrir dossier</button>
        <input type="file" id="folderInput" class="hidden-input" webkitdirectory multiple>

        <select id="folderFileSelect" class="file-select" title="Fichiers Markdown du dossier" disabled>
          <option value="">Aucun dossier chargé</option>
        </select>

        <button type="button" class="btn btn-primary" id="btnSaveFile">Sauvegarder</button>
        <span class="current-filename" id="currentFileName">Sans titre.md</span>
      </div>

      <!-- Zone Centrale : Sélecteur de Mode (Rapport / Slide), Masquage éditeur et Défilement synchronisé -->
      <div class="header-group header-center">
        <div class="view-switcher">
          <button type="button" class="view-btn active" data-view="report" id="btnViewReport">Rapport</button>
          <button type="button" class="view-btn" data-view="slide" id="btnViewSlide">Slide</button>
        </div>
        <button type="button" class="btn" id="btnToggleEditor" title="Masquer ou afficher l'éditeur Markdown (Raccourci : F9)">Masquer l'éditeur</button>
        <button type="button" class="btn" id="btnToggleSyncScroll" title="Activer ou désactiver le défilement lié entre l'éditeur et l'aperçu (Raccourci : F8)">Défilement lié : Activé</button>
      </div>

      <!-- Zone Droite : Configuration, Export et Thème -->
      <div class="header-group header-right">
        <!-- Bouton direct d'accès à la page de paramétrage des styles -->
        <button type="button" class="btn" id="btnOpenStyleSettings" title="Personnaliser les polices, tailles et couleurs de chaque type de balise">Styles des balises</button>

        <!-- Menu déroulant Configuration -->
        <div class="dropdown" id="dropdownConfig">
          <button type="button" class="btn" id="btnToggleConfig">Configuration</button>
          <div class="dropdown-menu">
            <div class="dropdown-status" id="configStatusText">
              Config : par défaut<br>Modèle : par défaut
            </div>
            <button type="button" class="dropdown-item" id="btnMenuOpenStyleSettings">Paramétrer les styles des balises</button>
            <button type="button" class="dropdown-item" id="btnLoadConfigJson">Charger configuration (.json)</button>
            <button type="button" class="dropdown-item" id="btnLoadTemplateDocx">Charger modèle Word (.docx)</button>
            <button type="button" class="dropdown-item" id="btnLoadTemplatePptx">Charger modèle PowerPoint (.potx)</button>
            <button type="button" class="dropdown-item" id="btnLoadCustomCss">Charger CSS personnalisé (.css)</button>
            <button type="button" class="dropdown-item" id="btnResetConfig">Réinitialiser par défaut</button>
          </div>
          <input type="file" id="configJsonInput" class="hidden-input" accept=".json">
          <input type="file" id="templateDocxInput" class="hidden-input" accept=".docx,.dotx">
          <input type="file" id="templatePptxInput" class="hidden-input" accept=".potx">
          <input type="file" id="customCssInput" class="hidden-input" accept=".css">
        </div>

        <!-- Menu déroulant Exporter -->
        <div class="dropdown" id="dropdownExport">
          <button type="button" class="btn btn-primary" id="btnToggleExport">Exporter</button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item" id="btnExportHtml">HTML (.html)</button>
            <button type="button" class="dropdown-item" id="btnExportDocx">Word (.docx)</button>
            <button type="button" class="dropdown-item" id="btnExportPptx">PowerPoint (.pptx)</button>
          </div>
        </div>

        <!-- Bouton de bascule de thème -->
        <button type="button" class="btn" id="btnToggleTheme">Thème : Sombre</button>
      </div>
    </header>

    <!-- Espace de Travail Split-View (Gauche : Éditeur / Droite : Aperçu) -->
    <main class="workspace" id="workspace">
      <section class="pane-editor" id="paneEditor">
        <!-- Barre d'outils supérieure de l'éditeur Markdown -->
        <div class="editor-toolbar" id="editorToolbar">
          <div class="editor-toolbar-left">
            <button type="button" class="btn btn-sm" id="btnToggleEditorToc" title="Afficher ou masquer le sommaire des titres Markdown">Sommaire</button>
            <span class="editor-toc-count" id="editorTocCount">0 titre</span>
          </div>
          <div class="editor-toolbar-right">
            <button type="button" class="btn btn-sm" id="btnHideEditor" title="Masquer l'éditeur Markdown pour afficher l'aperçu plein écran">Masquer l'éditeur</button>
          </div>
        </div>

        <!-- Corps de l'éditeur avec volet sommaire (#, ##, ###) et saisie -->
        <div class="editor-body-container" id="editorBodyContainer">
          <aside class="editor-toc-sidebar" id="editorTocSidebar">
            <div class="editor-toc-header">
              <span class="editor-toc-title">Sommaire des titres</span>
              <button type="button" class="btn-subtle" id="btnCloseEditorToc" title="Fermer le sommaire">Fermer</button>
            </div>
            <div class="editor-toc-list" id="editorTocList">
              <div class="editor-toc-empty">Aucun titre détecté (#, ##, ###)</div>
            </div>
          </aside>

          <div
            id="mdEditor"
            class="md-editor"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            data-placeholder="Saisissez votre texte Markdown (.md) ici, ou glissez-déposez un fichier .md ou une image..."
            spellcheck="false"
          ></div>
        </div>
      </section>

      <div class="pane-resizer" id="paneResizer" title="Glisser pour ajuster la largeur"></div>

      <section class="pane-preview" id="panePreview">
        <iframe id="previewIframe" class="preview-iframe" title="Aperçu du document formaté"></iframe>
      </section>
    </main>

    <!-- Page de Paramétrage des Styles de Balises (Hors-ligne, sans icône) -->
    <section class="style-config-page" id="pageStyleConfig" style="display: none;"></section>
  </div>

  <!-- Conteneur de Notifications Textuelles -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Contrôleur Principal ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
